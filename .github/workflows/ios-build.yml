# iOS 未签名 IPA 云端构建（GitHub Actions，免费）
# 触发：GitHub 仓库 → Actions → "Build unsigned iOS IPA" → Run workflow
# 产物：运行详情页底部 Artifacts 下载 taobao-unsigned-ipa.zip，解压得 taobao_unsigned.ipa
# 安装：IPA 传到手机 → 全能签导入 → 签名 → 安装（无需开发者账号、无需电脑）

name: Build unsigned iOS IPA

on:
  workflow_dispatch:   # 手动触发，想打包时点一下即可

jobs:
  build:
    runs-on: macos-14   # 免费 macOS 运行器

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable   # 跟随 stable 最新版，避免版本号过期导致失败
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry taobao_unsigned.ipa Payload
          ls -lh taobao_unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: taobao-unsigned-ipa
          path: taobao_unsigned.ipa
          retention-days: 7
