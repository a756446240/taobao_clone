name: taobao_clone
description: 1:1 复刻淘宝 App 的全新架构 Flutter 项目（练习用）
publish_to: "none"
version: 1.9.167+208

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1
  # 网络图片缓存
  cached_network_image: ^3.3.1
  # 本地存储（搜索历史、收藏）
  shared_preferences: 2.5.5

  cupertino_icons: ^1.0.6
  # 视频播放（微淘 AI 视频轮播）
  video_player: ^2.9.2
  # 相册选图（商品图自定义替换）
  image_picker: ^1.1.2
  # 应用文档目录（保存替换后的商品图）
  path_provider: ^2.1.2
  # 侧滑操作按钮（购物车/消息列表）
  flutter_slidable: ^3.0.1
  # 文件选择（淘宝订单同步 JSON 导入）
  file_picker: ^8.0.0

  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

# v1.9.167：固定会漂移的原生插件版本，避免云端 pub get 拉到带 Swift 6 语法的新版导致编译失败。
# 云端 GitHub Actions 每次 pub get 重新解析（仓库不提交 lock），这些包会漂移到新版本：
# - shared_preferences_foundation 2.6.1：messages.g.swift 报 "Unexpected ',' separator"
# - video_player_avfoundation 2.12.3：用了 @isolated/@isolation 宏（Swift 6），编译报错
# - image_picker_ios 0.8.13+13：同上风险，锁定到 10-16 成功构建的版本
dependency_overrides:
  shared_preferences_foundation: 2.5.7
  video_player_avfoundation: 2.12.1
  image_picker_ios: 0.8.13+12

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/remote/
    - assets/images/orders/
    - assets/images/mine_icons/
    - assets/icons/mine/
    - assets/images/icons/
    - assets/images/tabbar/
    - assets/images/banner/
    - assets/images/shangou/
    - assets/images/feizhu/
    - assets/images/reviews/
    - assets/videos/
    - assets/data/
    - assets/materials/

  fonts:
    - family: TaobaoIconFont
      fonts:
        - asset: assets/fonts/taobao_iconfont.ttf
    - family: WeixinIconFont
      fonts:
        - asset: assets/fonts/weixin_iconfont.ttf
